<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 홈 화면 아이콘: 다홍 단색 배경에 익선관 쓴 왕 얼굴, 글자 없음. Claude가 그린 그림.
       가장자리가 잘려도(maskable) 얼굴이 안전 영역(가운데 80%) 안에 들어오게 그렸다. -->
  <defs>
    <radialGradient id="face" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#fde6cc"/><stop offset="1" stop-color="#f3cda6"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#c8372d"/>
  <circle cx="256" cy="270" r="196" fill="none" stroke="#d9a520" stroke-width="10" opacity=".55"/>

  <!-- 익선관 날개 -->
  <g stroke="#3a2416" stroke-width="7">
    <ellipse cx="160" cy="150" rx="36" ry="54" transform="rotate(-24 160 150)" fill="#2b2b33"/>
    <ellipse cx="352" cy="150" rx="36" ry="54" transform="rotate(24 352 150)" fill="#2b2b33"/>
  </g>
  <!-- 얼굴 -->
  <g stroke="#3a2416" stroke-width="7">
    <ellipse cx="128" cy="300" rx="22" ry="28" fill="url(#face)"/>
    <ellipse cx="384" cy="300" rx="22" ry="28" fill="url(#face)"/>
    <ellipse cx="256" cy="292" rx="134" ry="124" fill="url(#face)"/>
  </g>
  <!-- 익선관 -->
  <g stroke="#3a2416" stroke-width="7" stroke-linejoin="round">
    <path d="M128 236 C 128 150 186 118 256 118 C 326 118 384 150 384 236 Z" fill="#2b2b33"/>
    <path d="M192 186 C 192 128 222 100 256 100 C 290 100 320 128 320 186 Z" fill="#33333d"/>
    <rect x="120" y="216" width="272" height="36" rx="16" fill="#22222a"/>
  </g>
  <!-- 눈·볼·수염·입 -->
  <g fill="#3a2416">
    <ellipse cx="210" cy="300" rx="14" ry="18"/>
    <ellipse cx="302" cy="300" rx="14" ry="18"/>
  </g>
  <circle cx="215" cy="293" r="5" fill="#fff"/>
  <circle cx="307" cy="293" r="5" fill="#fff"/>
  <ellipse cx="180" cy="340" rx="24" ry="14" fill="#f49a8a" opacity=".6"/>
  <ellipse cx="332" cy="340" rx="24" ry="14" fill="#f49a8a" opacity=".6"/>
  <path d="M228 356 C 240 348 250 351 256 357 C 262 351 272 348 284 356 C 275 361 264 363 256 360 C 248 363 237 361 228 356 Z" fill="#3a2416"/>
  <path d="M236 370 Q 256 390 276 370" fill="none" stroke="#3a2416" stroke-width="7" stroke-linecap="round"/>
</svg>
