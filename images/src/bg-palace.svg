<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1536" width="2048" height="1536">
  <!-- 조선 궁궐(정전) 느낌의 단순한 낮 풍경. 가운데 위쪽은 비워 둔다. Claude가 그린 그림 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fbbe6"/>
      <stop offset="0.6" stop-color="#bfe4f5"/>
      <stop offset="1" stop-color="#e9f6fb"/>
    </linearGradient>
    <linearGradient id="mtFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc6a6"/><stop offset="1" stop-color="#c3dcc5"/>
    </linearGradient>
    <linearGradient id="mtNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9a6c"/><stop offset="1" stop-color="#86b48d"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55606b"/><stop offset="1" stop-color="#39424b"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4d9c1"/><stop offset="1" stop-color="#c9b994"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eadfc6"/><stop offset="1" stop-color="#d9caa8"/>
    </linearGradient>
    <!-- 기와 골 -->
    <pattern id="tiles" width="22" height="40" patternUnits="userSpaceOnUse">
      <rect width="22" height="40" fill="url(#roof)"/>
      <rect x="0" width="7" height="40" fill="#2e353c" opacity=".55"/>
    </pattern>
    <!-- 단청 띠 -->
    <pattern id="dancheong" width="64" height="34" patternUnits="userSpaceOnUse">
      <rect width="64" height="34" fill="#1f7a6d"/>
      <rect x="4" y="4" width="24" height="26" rx="6" fill="#2fa08c"/>
      <circle cx="16" cy="17" r="7" fill="#f2efe4"/>
      <circle cx="16" cy="17" r="3.5" fill="#c8372d"/>
      <rect x="34" y="6" width="26" height="22" fill="#c8372d"/>
      <rect x="40" y="11" width="14" height="12" fill="#f2cf63"/>
    </pattern>
    <!-- 창살 문 -->
    <pattern id="lattice" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#e9cf98"/>
      <path d="M0 0H26M0 13H26M0 0V26M13 0V26" stroke="#8b5e34" stroke-width="3"/>
    </pattern>
    <pattern id="wallBlocks" width="90" height="44" patternUnits="userSpaceOnUse">
      <rect width="90" height="44" fill="url(#stone)"/>
      <path d="M0 0H90M0 22H90M45 0V22M0 22V44" stroke="#b6a47c" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- 하늘 -->
  <rect width="2048" height="1536" fill="url(#sky)"/>
  <circle cx="1780" cy="190" r="90" fill="#fff6c9" opacity=".85"/>
  <circle cx="1780" cy="190" r="140" fill="#fff6c9" opacity=".25"/>

  <!-- 구름 (가장자리에만) -->
  <g fill="#ffffff" opacity=".92">
    <g transform="translate(180 250)">
      <ellipse cx="0" cy="0" rx="120" ry="44"/><ellipse cx="90" cy="-28" rx="80" ry="50"/><ellipse cx="180" cy="4" rx="110" ry="40"/>
    </g>
    <g transform="translate(1460 400)">
      <ellipse cx="0" cy="0" rx="100" ry="36"/><ellipse cx="80" cy="-24" rx="70" ry="44"/><ellipse cx="160" cy="2" rx="90" ry="34"/>
    </g>
    <g transform="translate(90 560)" opacity=".8">
      <ellipse cx="0" cy="0" rx="90" ry="28"/><ellipse cx="70" cy="-16" rx="60" ry="34"/><ellipse cx="140" cy="0" rx="70" ry="26"/>
    </g>
  </g>

  <!-- 산 -->
  <path d="M0 980 C 180 860 300 820 460 880 C 600 760 760 700 900 800 C 1000 700 1120 690 1220 780 C 1380 690 1560 720 1700 840 C 1820 800 1950 830 2048 880 V1200 H0 Z" fill="url(#mtFar)"/>
  <path d="M0 1060 C 160 980 280 960 420 1010 C 560 930 700 940 820 1000 L 1240 1000 C 1360 930 1520 920 1640 1000 C 1780 960 1920 980 2048 1030 V1240 H0 Z" fill="url(#mtNear)"/>
  <!-- 소나무 -->
  <g fill="#3f7a4a">
    <ellipse cx="120" cy="1090" rx="90" ry="36"/><ellipse cx="150" cy="1050" rx="70" ry="28"/>
    <ellipse cx="1930" cy="1095" rx="95" ry="36"/><ellipse cx="1900" cy="1052" rx="70" ry="28"/>
  </g>

  <!-- 마당 바탕 -->
  <rect x="0" y="1330" width="2048" height="206" fill="url(#ground)"/>
  <!-- 좌우 회랑 -->
  <g id="corridor">
    <rect x="0" y="1210" width="330" height="130" fill="#f1e6cc"/>
    <g fill="#b83a2e">
      <rect x="18" y="1210" width="18" height="130"/><rect x="96" y="1210" width="18" height="130"/>
      <rect x="174" y="1210" width="18" height="130"/><rect x="252" y="1210" width="18" height="130"/>
    </g>
    <rect x="0" y="1188" width="345" height="22" fill="url(#dancheong)"/>
    <path d="M-20 1196 L 360 1196 Q 330 1150 300 1130 L -20 1130 Z" fill="url(#tiles)"/>
    <rect x="-20" y="1120" width="322" height="14" rx="6" fill="#2b3238"/>
  </g>
  <use href="#corridor" transform="translate(2048 0) scale(-1 1)"/>

  <!-- 월대(돌 기단) -->
  <rect x="190" y="1330" width="1668" height="86" fill="url(#wallBlocks)"/>
  <rect x="190" y="1322" width="1668" height="12" fill="#efe6d2"/>
  <rect x="300" y="1262" width="1448" height="70" fill="url(#wallBlocks)"/>
  <rect x="300" y="1254" width="1448" height="12" fill="#efe6d2"/>
  <!-- 돌난간 기둥 -->
  <g fill="#f3ecdc" stroke="#b6a47c" stroke-width="2">
    <rect x="200" y="1296" width="14" height="30"/><rect x="330" y="1296" width="14" height="30"/><rect x="460" y="1296" width="14" height="30"/>
    <rect x="1574" y="1296" width="14" height="30"/><rect x="1704" y="1296" width="14" height="30"/><rect x="1834" y="1296" width="14" height="30"/>
  </g>
  <!-- 계단 -->
  <g fill="#efe6d2" stroke="#b6a47c" stroke-width="3">
    <rect x="904" y="1262" width="240" height="22"/><rect x="896" y="1284" width="256" height="22"/>
    <rect x="888" y="1306" width="272" height="22"/><rect x="880" y="1328" width="288" height="22"/>
    <rect x="872" y="1350" width="304" height="22"/><rect x="864" y="1372" width="320" height="22"/>
    <rect x="856" y="1394" width="336" height="22"/>
  </g>

  <!-- 마당과 어도 -->
  <rect x="0" y="1416" width="2048" height="120" fill="url(#ground)"/>
  <path d="M880 1416 L1168 1416 L1260 1536 L788 1536 Z" fill="#d6c5a0"/>
  <path d="M960 1416 L1088 1416 L1120 1536 L928 1536 Z" fill="#cbb98f"/>

  <!-- 정전 아래층 몸체 -->
  <rect x="470" y="1036" width="1108" height="226" fill="#f3e7c9"/>
  <g fill="url(#lattice)">
    <rect x="530" y="1066" width="104" height="196"/><rect x="672" y="1066" width="104" height="196"/>
    <rect x="814" y="1066" width="104" height="196"/><rect x="956" y="1066" width="136" height="196"/>
    <rect x="1130" y="1066" width="104" height="196"/><rect x="1272" y="1066" width="104" height="196"/>
    <rect x="1414" y="1066" width="104" height="196"/>
  </g>
  <g fill="#b83a2e">
    <rect x="490" y="1036" width="34" height="226"/><rect x="636" y="1036" width="34" height="226"/>
    <rect x="778" y="1036" width="34" height="226"/><rect x="920" y="1036" width="34" height="226"/>
    <rect x="1094" y="1036" width="34" height="226"/><rect x="1236" y="1036" width="34" height="226"/>
    <rect x="1378" y="1036" width="34" height="226"/><rect x="1524" y="1036" width="34" height="226"/>
  </g>
  <rect x="470" y="1036" width="1108" height="30" fill="#1f7a6d"/>
  <rect x="420" y="1004" width="1208" height="36" fill="url(#dancheong)"/>

  <!-- 정전 위층 몸체 -->
  <rect x="700" y="820" width="648" height="96" fill="#f3e7c9"/>
  <g fill="url(#lattice)">
    <rect x="760" y="846" width="110" height="70"/><rect x="908" y="846" width="232" height="70"/><rect x="1178" y="846" width="110" height="70"/>
  </g>
  <g fill="#b83a2e">
    <rect x="720" y="820" width="30" height="96"/><rect x="874" y="820" width="30" height="96"/>
    <rect x="1144" y="820" width="30" height="96"/><rect x="1298" y="820" width="30" height="96"/>
  </g>
  <rect x="660" y="794" width="728" height="32" fill="url(#dancheong)"/>

  <!-- 아래층 지붕 (처마 끝이 살짝 들린 곡선) -->
  <path d="M300 968 Q 420 1012 600 1006 L 1448 1006 Q 1628 1012 1748 968
           Q 1660 960 1560 930 L 1340 904 L 708 904 L 488 930 Q 388 960 300 968 Z" fill="url(#tiles)"/>
  <path d="M300 968 Q 420 1012 600 1006 L 1448 1006 Q 1628 1012 1748 968" fill="none" stroke="#2b3238" stroke-width="12" stroke-linecap="round"/>
  <!-- 위층 지붕 -->
  <path d="M500 766 Q 620 812 790 804 L 1258 804 Q 1428 812 1548 766
           Q 1440 740 1340 690 L 1220 650 L 828 650 L 708 690 Q 608 740 500 766 Z" fill="url(#tiles)"/>
  <path d="M500 766 Q 620 812 790 804 L 1258 804 Q 1428 812 1548 766" fill="none" stroke="#2b3238" stroke-width="12" stroke-linecap="round"/>
  <!-- 용마루 -->
  <path d="M800 652 L 1248 652 L 1262 620 Q 1240 632 1220 634 L 828 634 Q 808 632 786 620 Z" fill="#2b3238"/>
  <rect x="806" y="628" width="436" height="14" fill="#e8e2d4"/>
  <path d="M780 626 q -6 -38 26 -50 q -4 26 10 40 z M1268 626 q 6 -38 -26 -50 q 4 26 -10 40 z" fill="#2b3238"/>
  <!-- 현판 -->
  <rect x="954" y="826" width="140" height="58" rx="4" fill="#1e3a5f" stroke="#d9a520" stroke-width="6"/>
  <g fill="#f2cf63"><rect x="980" y="846" width="22" height="18" rx="3"/><rect x="1013" y="846" width="22" height="18" rx="3"/><rect x="1046" y="846" width="22" height="18" rx="3"/></g>
</svg>
