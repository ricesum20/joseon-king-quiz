<!doctype html>
<meta charset="utf-8">
<title>render</title>
<!-- tools/render.sh가 쓰는 변환 페이지: SVG를 캔버스에 그려 PNG/WebP 데이터로 내보낸다 -->
<pre id="out"></pre>
<script>
  const p = new URLSearchParams(location.search);
  const src = p.get("src"), w = +p.get("w"), h = +p.get("h");
  const type = p.get("type") || "image/png", q = +(p.get("q") || 0.9);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    document.getElementById("out").textContent = "DATA:" + c.toDataURL(type, q) + ":END";
  };
  img.onerror = () => { document.getElementById("out").textContent = "ERROR"; };
  img.src = "../" + src;
</script>
